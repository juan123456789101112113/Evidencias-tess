<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ tab_title }}{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .car_item { border: 1px solid #ddd; padding: 20px; margin: 20px 0; }
        .car_item h2 { color: #333; }
        .meta { color: #666; font-size: 0.9em; }
        h3 { color: #007cba; text-decoration: none; }
        h3:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{% url 'template_get_all_cars' %}">🎨 Dynamic Pages - My cars</a></h1>
            <nav style="margin: 10px 0;">
                <a href="/static-pages/" style="margin-right: 15px;">📄 Static Pages</a>
                <a href="/dynamic-pages/" style="margin-right: 15px;">🎨 Dynamic Pages</a>
                <a href="/api/v1/car/" style="margin-right: 15px;">🔌 API JSON</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
